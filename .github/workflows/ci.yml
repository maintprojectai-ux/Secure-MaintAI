name: Secure-MaintAI CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Check code formatting (Ruff)
        run: ruff format --check backend/ tests/ scripts/ database/

      - name: Linting (Ruff)
        run: ruff check backend/ tests/ scripts/ database/

      - name: Type checking (Mypy)
        run: mypy backend/ --ignore-missing-imports

  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Install requirements
        run: pip install -r backend/requirements.txt

      - name: Dependency vulnerability scan
        run: pip-audit --requirement backend/requirements.txt || echo "Audit completed"

      - name: Static application security testing (Bandit)
        run: bandit -r backend/ -ll -ii || echo "Bandit scan completed"

  tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secure_maintai
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: secure_maintai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        env:
          APP_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5433
          DATABASE_NAME: secure_maintai_test
          DATABASE_USER: secure_maintai
          DATABASE_PASSWORD: test-password
          APP_SECRET_KEY: ci-test-secret-key-32-characters-long
          AUTH_JWT_SECRET_KEY: ci-test-jwt-secret-key-32-chars-min
        run: |
          python -m pytest tests/ -v --cov=backend
