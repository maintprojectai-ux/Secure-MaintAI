# Secure-MaintAI — Test Docker Compose
# Usage: docker compose -f infrastructure/docker/docker-compose.test.yml up -d

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secure_maintai
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: secure_maintai_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_maintai"]
      interval: 3s
      timeout: 3s
      retries: 5
